name: catalogue
# Rebuilds catalog/catalog.json from Open Food Facts (Albert Heijn, Jumbo, Picnic in NL).
on:
  schedule:
    - cron: '23 3 * * 1'     # every Monday 03:23 UTC
  workflow_dispatch:         # "Run workflow" button on GitHub (or via the API)
permissions:
  contents: write
  pages: write
concurrency:
  group: catalogue
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/catalog.js
      - run: node scripts/build-catalog.js
      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet -- catalog/; then echo "No changes"; echo "changed=no" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/catalog.json
          git commit -m "Catalogue refresh $(date -u +%d/%m/%Y)"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=yes" >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages
        # pushes made by this workflow don't trigger the Pages build on their own
        if: steps.commit.outputs.changed == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages rebuild request failed; it will publish on the next push."
